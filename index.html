    <script>
      // Aggressively clear ALL caches and service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Service worker unregistered');
          }
        });
      }
      
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            caches.delete(name);
            console.log('Cache cleared:', name);
          }
        });
      }
      
      // Clear session storage just in case
      sessionStorage.clear();
      
      console.log('Total cache and SW purge completed');
    </script>

    <!-- Initialize Dark Mode Before React Loads -->
    <script>
      // Set dark mode as default if not already set
      (function() {
        const saved = localStorage.getItem("darkMode");
        if (saved === null) {
          localStorage.setItem("darkMode", "true");
          document.documentElement.classList.add("dark");
        } else if (saved === "true") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
